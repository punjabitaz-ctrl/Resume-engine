<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Engine</title>
<meta name="referrer" content="no-referrer">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><h1>Resume Engine</h1><span id="storeNote">loading</span></div>
  <div class="counts" id="counts"></div>
  <button class="quiet" data-act="sync" id="syncBtn" title="Reload saved data">Sync</button>
</div></header>
<nav class="tabs" aria-label="Sections"><div class="wrap" id="tabs"></div></nav>
<main><div class="wrap" id="view"><div class="card"><p class="lede">Loading your fact base.</p></div></div></main>
<div id="toast" aria-live="polite"></div>
<div id="busy" class="busy" hidden><span class="dot"></span><span id="busyText"></span><button data-act="stop">Stop</button></div>

<script src="app.js"></script>
</body>
</html>
