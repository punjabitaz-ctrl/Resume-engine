<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a proofreader's desk. One column on phones, a fact rail beside the sheet on wide screens. Blue pencil marks what the engine wrote; red marks what needs your eye. */
:root{
  --bg:#eef1f5; --surface:#ffffff; --ink:#141c27; --muted:#5a6878; --line:#d5dbe3;
  --accent:#2447c9; --accent-ink:#ffffff; --accent-soft:#e4e9fb;
  --good:#1a7449; --good-soft:#dff2e8; --warn:#8f5700; --warn-soft:#fbeed3; --bad:#b0261c; --bad-soft:#fbe3e0;
  --paper:#ffffff; --paper-ink:#111111;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10151c; --surface:#19202a; --ink:#e8edf3; --muted:#97a4b4; --line:#2c3644;
    --accent:#8ea6ff; --accent-ink:#0c1330; --accent-soft:#222c4d;
    --good:#62c996; --good-soft:#173527; --warn:#e3b05a; --warn-soft:#3a2d12; --bad:#f08a80; --bad-soft:#40201d;
    --paper:#f6f6f3; --paper-ink:#111111;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10151c; --surface:#19202a; --ink:#e8edf3; --muted:#97a4b4; --line:#2c3644;
  --accent:#8ea6ff; --accent-ink:#0c1330; --accent-soft:#222c4d;
  --good:#62c996; --good-soft:#173527; --warn:#e3b05a; --warn-soft:#3a2d12; --bad:#f08a80; --bad-soft:#40201d;
  --paper:#f6f6f3; --paper-ink:#111111;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h1{font-size:18px;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;font-weight:600}
h3{font-size:14px;font-weight:600}
p{margin:0}
a{color:var(--accent)}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-top:12px;padding-bottom:10px}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand span{color:var(--muted);font-size:12.5px}
.counts{display:flex;gap:12px;font:12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.counts b{color:var(--ink);font-weight:500}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{flex:none;padding:11px 12px;font-weight:500;font-size:14px;color:var(--muted);text-decoration:none;border-bottom:2px solid transparent}
nav.tabs a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
nav.tabs a i{font:11px var(--mono);font-style:normal;margin-right:5px;opacity:.7}
main{padding:20px 0 96px}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.lede{color:var(--muted);max-width:65ch}
.small{font-size:12.5px;color:var(--muted)}
.mono{font-family:var(--mono);font-size:12.5px}
label{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:500;color:var(--muted);min-width:0}
input[type=text],input[type=url],input[type=password],input[type=file],select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:9px 10px;width:100%;min-width:0}
textarea{min-height:120px;resize:vertical;line-height:1.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:500;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.quiet{border-color:transparent;color:var(--muted);padding:6px 8px}
button.danger{color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:4px;font:12px var(--mono);padding:2px 8px;border-radius:99px;background:var(--bg);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.hit{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.miss{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.chip.have{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.acc{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.item{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.item:first-child{border-top:0;padding-top:0}
.fact{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:start;padding:7px 0;border-top:1px dashed var(--line)}
.fact.off .ftext{color:var(--muted);text-decoration:line-through}
.fact input{margin-top:4px;width:16px;height:16px}
.ftext{outline:0;border-radius:4px;padding:1px 3px;overflow-wrap:anywhere}
.ftext:focus{background:var(--accent-soft)}
.sheet.norule h5{border-bottom:0;font-size:1.02em;margin-top:18px}
.ver.on{border-left:3px solid var(--accent);padding-left:10px}
.vlabel{font-weight:600;outline:0;border-radius:4px;padding:1px 4px;border-bottom:1px dashed var(--line)}
.vlabel:focus{background:var(--accent-soft)}
.diff{font:12.5px/1.5 var(--mono);display:flex;flex-direction:column;gap:2px}
.diff div{padding:2px 6px;border-radius:4px;overflow-wrap:anywhere}
.diff .add{background:var(--good-soft);color:var(--good)}
.diff .del{background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.diff .ctx{color:var(--muted);font-weight:500;margin-top:6px}
.proposal{border-left:4px solid var(--accent)}
a.btn{display:inline-block;font-weight:500;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 13px;text-decoration:none}
.incident{border-color:var(--bad);border-left:4px solid var(--bad)}
.fmeta summary{list-style:none;cursor:pointer;margin-top:4px}.fmeta summary::-webkit-details-marker{display:none}.fmeta .grid2{margin-top:8px}
.checks b.mono{width:64px}
.banner button{margin-left:6px;padding:4px 10px}
.meter{display:flex;align-items:center;gap:12px}
.meter .num{font:600 30px/1 var(--mono);font-variant-numeric:tabular-nums}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
.good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)}
.checks{display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.checks div{display:flex;gap:8px}
.checks b{font:12px var(--mono);width:44px;flex:none}
.split{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:900px){.split{grid-template-columns:minmax(0,1fr) 330px;align-items:start}}
.sheetbox{overflow-x:auto}
.sheet{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);border-radius:4px;padding:28px 26px;font:13px/1.42 Arial,Helvetica,sans-serif;min-width:0}
.sheet h4{font-size:1.5em;margin:0;letter-spacing:.01em}
.sheet .contact{font-size:.92em;margin-top:3px}
.sheet h5{font-size:.92em;letter-spacing:.07em;text-transform:uppercase;border-bottom:1px solid #111;margin:14px 0 6px;padding-bottom:2px}
.sheet .role{display:flex;flex-wrap:wrap;justify-content:space-between;gap:0 12px;font-weight:700;margin-top:8px}
.sheet .role span:last-child{font-weight:400}
.sheet ul{margin:4px 0 0;padding-left:18px}
.sheet li{margin:2px 0}
.sheet [contenteditable]{outline:0;border-radius:3px}
.sheet [contenteditable]:focus{background:#e4e9fb}
.sheet .flag{background:#fbe3e0;box-shadow:0 0 0 2px #fbe3e0}
.busy{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--bg);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:center;font-size:14px}
.busy button{background:transparent;color:inherit;border-color:currentColor;padding:4px 10px}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}}
#toast{position:fixed;left:16px;right:16px;bottom:70px;z-index:30;display:flex;justify-content:center;pointer-events:none}
#toast div{background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;max-width:520px;font-size:14px}
#toast div.bad{background:var(--bad);color:#fff}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13.5px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.steps div{border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;color:var(--muted)}
.steps div b{display:block;color:var(--ink);font-weight:600}
.steps div.done{border-color:var(--good);background:var(--good-soft)}
.steps i{font:11px var(--mono);font-style:normal;color:var(--accent)}
[hidden]{display:none!important}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><h1>Resume Engine</h1><span id="storeNote">loading</span></div>
  <div class="counts" id="counts"></div>
  <button class="quiet" data-act="sync" id="syncBtn" title="Reload saved data">Sync</button>
</div></header>
<nav class="tabs" aria-label="Sections"><div class="wrap" id="tabs"></div></nav>
<main><div class="wrap" id="view"><div class="card"><p class="lede">Loading your fact base.</p></div></div></main>
<div id="toast" aria-live="polite"></div>
<div id="busy" class="busy" hidden><span class="dot"></span><span id="busyText"></span><button data-act="stop">Stop</button></div>

<script>
"use strict";
/* ---------- state ---------- */
const S={profile:{},roles:[],facts:[],memory:[],sources:[],jobs:[],resumes:[],ui:{draft:{},jobId:null,resId:null,q:'',iv:null,imp:null,proposal:null,repairOnce:false,incident:null,health:[],checked:false,restore:null},busy:null,ready:false};
const TABS=[['sources','Sources'],['wins','Wins'],['interview','Interview'],['facts','Fact base'],['jobs','Jobs'],['tailor','Tailor'],['memory','Memory'],['data','Setup']];
const KINDS=['win','achievement','responsibility','skill','project','education','certification','award','summary','other'];
const STATUSES=['Saved','Applied','Interview','Offer','Rejected','No response'];
const APP_VERSION='0.10.0';
const IN_CLAUDE=!!(window.claude&&window.claude.use);
const REPO='https://github.com/punjabitaz-ctrl/Resume-engine';
const errs=[];function logErr(where,e){errs.push({at:new Date().toISOString(),where:String(where),code:String((e&&e.code)||''),msg:String((e&&e.message)||'').slice(0,200)});if(errs.length>8)errs.shift()}
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const clone=o=>JSON.parse(JSON.stringify(o??null));
const norm=s=>String(s??'').toLowerCase().replace(/[‐-―\-_/]/g,' ').replace(/[^a-z0-9+#.&% ]/g,' ').replace(/\s+/g,' ').trim();
const D=k=>S.ui.draft[k]??'';
function toast(msg,kind){const t=$('#toast');t.innerHTML='<div class="'+(kind||'')+'">'+esc(msg)+'</div>';clearTimeout(toast.t);toast.t=setTimeout(()=>{t.innerHTML=''},kind==='bad'?7000:3200)}

/* ---------- pure logic: dates, keywords, numbers, scoring ---------- */
function dateKey(s){s=String(s||'').toLowerCase();if(!s)return 0;if(/present|current|now/.test(s))return 999912;const y=(s.match(/(19|20)\d{2}/)||[])[0];if(!y)return 0;const mi=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'].findIndex(m=>s.includes(m));const mn=(s.match(/\b(0?[1-9]|1[0-2])[\/.-](?:19|20)\d{2}/)||[])[1];return +y*100+(mi>=0?mi+1:(mn?+mn:0))}
function sortedRoles(){return S.roles.slice().sort((a,b)=>(dateKey(b.end)||dateKey(b.start))-(dateKey(a.end)||dateKey(a.start))||dateKey(b.start)-dateKey(a.start))}
function roleDates(r){return [r.start,r.end].filter(Boolean).join(' - ')}
function hasTerm(text,term){const t=norm(term);if(!t)return false;const hay=' '+norm(text)+' ';const forms=[t];if(t.endsWith('s'))forms.push(t.slice(0,-1));else forms.push(t+'s');return forms.some(f=>hay.includes(' '+f+' ')||hay.includes(' '+f+'.')||hay.includes(' '+f+','))}
function kwHit(text,kw){return [kw.term].concat(kw.variants||[]).some(t=>hasTerm(text,t))}
function scoreText(job,text){const kws=(job&&job.analysis&&job.analysis.keywords)||[];let tot=0,got=0;const hit=[],miss=[];for(const k of kws){const w=Math.min(3,Math.max(1,+k.weight||1));tot+=w;if(kwHit(text,k)){got+=w;hit.push(k)}else miss.push(k)}return{pct:tot?Math.round(100*got/tot):0,hit,miss,total:kws.length}}
function nums(s){return (String(s??'').match(/\d[\d,]*(?:\.\d+)?/g)||[]).map(x=>x.replace(/,/g,'').replace(/\.0+$/,''))}
function unverifiedNums(text,evidence){const ev=new Set(nums(evidence));return nums(text).filter(n=>!ev.has(n))}
function factsText(list){return list.map(f=>f.text).join('\n')}
function usableFacts(){return S.facts.filter(f=>f.ok!==false)}
function allEvidence(){return factsText(usableFacts())+'\n'+S.roles.map(r=>[r.company,r.title,r.location,r.start,r.end].join(' ')).join('\n')+'\n'+Object.values(S.profile).join(' ')}
function words(s){return (String(s).trim().match(/\S+/g)||[]).length}
function contactLine(){const p=S.profile;return [p.location,p.phone,p.email].concat(p.links||[]).filter(Boolean).join(' | ')}
function resumeText(r){const p=S.profile,L=[];L.push(p.name||'');if(r.headline)L.push(r.headline);L.push(contactLine());if(r.summary){L.push('','SUMMARY',r.summary)}if((r.skills||[]).length){L.push('','SKILLS');for(const g of r.skills)L.push((g.group?g.group+': ':'')+(g.items||[]).join(', '))}if((r.experience||[]).length){L.push('','EXPERIENCE');for(const e of r.experience){L.push('',[e.title,e.company].filter(Boolean).join(', ')+(e.location?' | '+e.location:'')+(e.dates?' | '+e.dates:''));for(const b of e.bullets||[])L.push('• '+b.text)}}if((r.projects||[]).length){L.push('','PROJECTS');for(const x of r.projects)L.push('• '+(x.name?x.name+': ':'')+x.text)}if((r.education||[]).length){L.push('','EDUCATION');for(const x of r.education)L.push(x.text)}if((r.certifications||[]).length){L.push('','CERTIFICATIONS');for(const x of r.certifications)L.push(x.text)}return L.join('\n')}
function flagsFor(r){const byId=Object.fromEntries(S.facts.map(f=>[f.id,f]));const all=allEvidence();const out=[];const chk=(where,text,ev)=>{const bad=unverifiedNums(text,ev);if(bad.length)out.push({where,text,nums:bad})};if(r.summary)chk('summary',r.summary,all);(r.experience||[]).forEach((e,i)=>{const role=S.roles.find(x=>x.id===e.roleId)||{};(e.bullets||[]).forEach((b,j)=>{const cited=(b.facts||[]).map(id=>byId[id]).filter(Boolean);const ev=factsText(cited)+' '+[role.start,role.end,e.dates].join(' ');if(!cited.length){if(unverifiedNums(b.text,all).length)out.push({where:'e'+i+'b'+j,text:b.text,nums:unverifiedNums(b.text,all)});else if(!(b.facts||[]).length)out.push({where:'e'+i+'b'+j,text:b.text,nums:[],nosrc:true})}else chk('e'+i+'b'+j,b.text,ev)})});(r.projects||[]).forEach((x,i)=>chk('p'+i,x.text,all));return out}
/* Words and phrases that read as filler or as machine-written. A term is allowed when the posting itself asks for it. */
const TIRED=['results-driven','results driven','detail-oriented','detail oriented','self-starter','self-starting','dynamic','proven track record','passionate','synergy','synergies','leverage','leveraged','leveraging','spearhead','spearheaded','spearheading','utilize','utilized','utilizing','robust','seamless','seamlessly','cutting-edge','cutting edge','delve','innovative','team player','go-getter','hard-working','highly motivated','fast-paced','thought leader','best-in-class','world-class','game-changing','holistic','orchestrated','championed','pivotal','fostered','harnessed','tapestry','testament','responsible for','duties included','worked on','assisted with','helped with'];
const STOP=new Set('the and for with that this from into over across were was are has have had their them they she his her its our your you who which while when where than then also more most very each per via within through including include about after before during under'.split(' '));
const stem=w=>w.length>4?w.replace(/(ing|ed|es|s)$/,''):w;
function toks(t){return (norm(t).match(/[a-z0-9+#&%.]+/g)||[]).map(w=>w.replace(/^\.+|\.+$/g,'')).filter(w=>w.length>2&&!STOP.has(w)).map(stem)}
function corpus(){const t=S.sources.filter(x=>x&&x.trusted!==false).map(x=>x.text).join('\n');return{words:new Set(toks(t)),nums:new Set(nums(t))}}
/* A fact counts as matching the user's own material when every number in it appears there and at least three quarters of its meaningful words do. */
function matchesSource(text,c){if(nums(text).some(n=>!c.nums.has(n)))return false;const w=toks(text).filter(x=>!/^\d/.test(x));if(!w.length)return true;return w.filter(x=>c.words.has(x)).length/w.length>=0.75}
function atsChecks(r,flags,job){const p=S.profile,t=resumeText(r),w=words(t),out=[],add=(g,ok,label,fix)=>out.push({g,ok:!!ok,label,fix:ok?'':fix||''});
 const bullets=(r.experience||[]).flatMap(e=>e.bullets||[]).map(b=>String(b.text||'')),body=[r.headline,r.summary].concat(bullets,(r.projects||[]).map(x=>x.text)).filter(Boolean).join('\n'),kws=(job&&job.analysis&&job.analysis.keywords)||[];
 // parses cleanly and can be found
 add('ats',p.email&&p.phone,'Contact line has email and phone');
 add('ats',r.summary&&(r.skills||[]).length&&(r.experience||[]).length,'Standard sections: Summary, Skills, Experience');
 add('ats',(r.education||[]).length>0,'Education section present');
 const badDates=(r.experience||[]).filter(e=>!/^[A-Z][a-z]{2} \d{4} - ([A-Z][a-z]{2} \d{4}|Present)$/.test(e.dates||'')).length;
 add('ats',badDates===0,badDates?badDates+' roles have dates that are missing or not in "Mon YYYY - Mon YYYY" form. Fix them in Fact base':'Every role has dates in one plain format');
 const title=job&&job.title?norm(job.title):'';if(title)add('ats',norm([r.headline,r.summary].join(' ')).includes(title),'The posting’s job title appears in the headline or summary','Work the exact job title "'+job.title+'" into the headline, if the facts support that kind of work.');
 const stuffed=kws.filter(k=>{const n=norm(k.term);return n.length>3&&norm(t).split(n).length-1>4}).map(k=>k.term);
 add('ats',!stuffed.length,stuffed.length?'Repeated too often: '+stuffed.slice(0,4).join(', '):'No term is repeated to the point of stuffing','Use each of these terms at most three times: '+stuffed.join(', ')+'.');
 const pairs=kws.map(k=>{const all=[k.term].concat(k.variants||[]),ac=all.find(x=>/^[A-Z0-9&]{2,6}$/.test(x)),lg=all.find(x=>x.split(' ').length>1);return ac&&lg?[ac,lg]:null}).filter(Boolean).filter(([ac,lg])=>hasTerm(t,ac)!==hasTerm(t,lg)&&(hasTerm(t,ac)||hasTerm(t,lg)));
 add('ats',!pairs.length,pairs.length?'Give both the short and long form: '+pairs.slice(0,3).map(x=>x[1]+' ('+x[0]+')').join(', '):'Abbreviations appear with their long form where it matters','Give both forms the first time: '+pairs.map(x=>x[1]+' ('+x[0]+')').join(', ')+'.');
 const odd=[...new Set((t.match(/[^\x09\x0a\x20-\x7e•’à-ÿ]/g)||[]))].filter(ch=>!/[–—]/.test(ch));
 add('ats',!odd.length,odd.length?'Unusual characters that some systems garble: '+odd.slice(0,6).join(' '):'Plain characters only','Replace these characters with plain ones: '+odd.join(' ')+'.');
 add('ats',w<=1100,'Length '+w+' words, about '+Math.max(1,Math.round(w/52)/10)+' pages (target 2 or fewer)','Cut the resume to under 850 words.');
 const numFlags=flags.filter(f=>f.nums.length).length;add('ats',numFlags===0,numFlags?numFlags+' lines contain numbers not found in your fact base':'Every number traces to your fact base');
 // reads like a person wrote it
 const dash=(body.match(/[–—]/g)||[]).length;add('human',!dash,dash?dash+' long dashes in the text':'No long dashes','Remove every em dash and en dash. Use a comma, a period, or the word "to".');
 const allowed=norm(kws.map(k=>k.term).join(' | ')),tired=TIRED.filter(x=>hasTerm(body,x)&&!allowed.includes(norm(x)));

- Mirror the posting's exact terms wherever the facts truthfully support them, so ATS and recruiter keyword screens match. Use the posting's phrasing over a synonym.
- Facts of kind "win" are full accomplishment stories in the candidate's own words, with the situation, task, action and result. Build the strongest bullets from them: the action first, the result last, numbers exactly as given. Choose a relevant win over a plain responsibility. One win makes one bullet, or two when it holds two distinct results.
- Bullets: strong verb first, then scope, then result. One idea each, 14 to 30 words. Lead each role with the bullets most relevant to this job. No first person, no filler ("responsible for", "results-driven", "proven track record").
- Recent and relevant roles get 4 to 6 bullets; older or less relevant roles get 1 to 3. Include every role so there are no date gaps, newest first.
- Summary: 3 sentences aimed at this job, opening with the candidate's professional identity in the posting's language, grounded in facts.
- Headline: the target title or closest truthful equivalent, plus 2 or 3 specialties.
- Skills: 3 to 4 groups of the posting's keywords the facts support, most important first.
- ${D('len')==='1'?'Fit one page: about 380 to 480 words in total, 2 to 4 bullets for recent relevant roles and 1 for older ones.':'Fit two pages: about 650 to 850 words in total.'}
- Plain text only. No tables, columns, icons, emoji or special symbols.

HUMAN VOICE (a recruiter must not be able to tell that software helped)
- Never use an em dash or an en dash. Use a comma, a period, or the word "to".
- Use plain verbs a person would say out loud: built, ran, cut, grew, signed, launched, fixed, led, sold, trained, opened, closed. Never use: ${TIRED.join(', ')}.
- No two bullets under one role open with the same word, and no word opens more than two bullets in the whole resume.
- Vary bullet length and shape. Some short, some fuller. Do not give every bullet the same rhythm and do not fall into lists of three.
- Every bullet names something specific from its facts: a partner, a product, a number, a team, a place. If a bullet could sit on anyone's resume, rewrite it from the facts or drop it.
- No claims about personal qualities and no stacked adjectives. Show the work and let it speak.

TRACKING SYSTEMS AND RECRUITER SEARCH
- A tracking system turns the resume into text fields, recruiters search it by job title and skill terms, then a person reads it for a few seconds. Write for all three.
- Put the posting's exact job title in the headline when the facts show the candidate doing that kind of work.
- For each skill the facts support, use the posting's exact phrase once in a sentence about real work and list it under Skills. Never use any term more than three times.
- The first time an abbreviation matters, give both forms, like "Search Engine Optimization (SEO)".
- Write date ranges exactly as given in ROLES.

const undash=t=>t.replace(/(\d)\s*[–—]\s*(\d)/g,'$1 to $2').replace(/\s*[–—]\s*/g,', ').replace(/,\s*,/g,',').replace(/,\s*([.;:!?])/g,'$1');

 fix(S.facts);fix(S.roles);fix(S.memory);fix(S.jobs);fix(S.resumes.filter(v=>v&&!v.sentAt));fix(S.profile)}
function checkData(){const out=[],obj=x=>x&&typeof x==='object'&&!Array.isArray(x);
 for(const k of ['roles','facts','memory','sources','jobs','resumes'])if(!Array.isArray(S[k]))out.push({text:'The saved '+k+' list is damaged and cannot be read',fix(){S[k]=[]}});
 if(!obj(S.profile))out.push({text:'The contact header is damaged',fix(){S.profile={}}});
 if(out.length)return out;
 const drop=(k,bad,text)=>{if(bad.length)out.push({text:bad.length+' '+text,fix(){S[k]=S[k].filter(x=>!bad.includes(x))}})};
 drop('roles',S.roles.filter(r=>!obj(r)||!r.id),'roles are unreadable');
 drop('facts',S.facts.filter(f=>!obj(f)||!f.id||typeof f.text!=='string'||!f.text.trim()),'facts have no text');
 drop('sources',S.sources.filter(x=>!obj(x)||!x.id||typeof x.text!=='string'),'sources are unreadable');
 drop('jobs',S.jobs.filter(x=>!obj(x)||!x.id||typeof x.jdText!=='string'),'jobs are unreadable');
 drop('resumes',S.resumes.filter(v=>!obj(v)||!v.id||!obj(v.resume)),'resume versions are unreadable');
 drop('memory',S.memory.filter(m=>!obj(m)||typeof m.text!=='string'||!m.text.trim()),'saved instructions are empty');
 const rid=new Set(S.roles.filter(obj).map(r=>r.id)),jid=new Set(S.jobs.filter(obj).map(j=>j.id));
 const orph=S.facts.filter(f=>obj(f)&&f.roleId&&!rid.has(f.roleId));if(orph.length)out.push({text:orph.length+' facts point to a role that no longer exists',fix(){for(const f of orph)f.roleId=''}});
 const seen=new Set(),dup=S.facts.filter(f=>obj(f)&&f.id&&(seen.has(f.id)||!seen.add(f.id)));if(dup.length)out.push({text:dup.length+' facts share an id with another fact',fix(){for(const f of dup)f.id=uid('f')}});
 const lost=S.resumes.filter(v=>obj(v)&&obj(v.resume)&&!jid.has(v.jobId));if(lost.length)out.push({text:lost.length+' resume versions belong to a job that no longer exists',fix(){S.resumes=S.resumes.filter(v=>!lost.includes(v))}});
 const SEC=['skills','experience','projects','education','certifications'],bent=S.resumes.filter(v=>obj(v)&&obj(v.resume)&&SEC.some(k=>v.resume[k]!=null&&!Array.isArray(v.resume[k])));if(bent.length)out.push({text:bent.length+' resume versions have a damaged section',fix(){for(const v of bent)for(const k of SEC)if(v.resume[k]!=null&&!Array.isArray(v.resume[k]))v.resume[k]=[]}});

function doRepair(quiet,pass){if(pass!==PASS)return 0;const ids={};for(const c of ['sources','jobs','resumes'])ids[c]=Array.isArray(S[c])?S[c].filter(x=>x&&x.id).map(x=>x.id):[];

 Store.saveAll();S.ui.health=checkData();S.ui.checked=true;if(!quiet){render();toast(n?'Repaired '+n+' problem'+(n>1?'s':'')+'. You can undo this in Setup.':'Nothing needed repair.')}return n}
function ruleDiagnosis(inc){const c=inc.code,ex=/extract|source|answers/i.test(inc.label),wr=/writing resume/i.test(inc.label);
 if(c==='network')return{cause:'The AI server did not answer. The address may be wrong, the connection may have dropped, or a local model is not running or does not allow this page.',fixes:['retry','nostream','setup']};
 if(AI_DOWN.includes(c))return{cause:'The AI engine settings need attention before this step can run.',fixes:IN_CLAUDE?['retry']:['setup']};
 if(c==='rate_limited')return{cause:'The provider is limiting how much you can send right now.',fixes:['wait']};
 if(c==='invalid_json')return inc.cut?{cause:'The answer was cut off before it finished, usually because one request asked for too much.',fixes:ex?['smaller','retry']:wr?['factCap','retry']:['retry']}:{cause:'The model returned an answer the app could not read as data.',fixes:ex?['tidy','jsonRepair','smaller','retry']:['tidy','jsonRepair','retry']};
 if(c==='prompt_too_large')return{cause:'The request was larger than the model accepts.',fixes:ex?['smaller']:wr?['factCap']:['report']};
 if(['empty_completion','upstream_error','lib','api'].includes(c))return{cause:'This looks like a temporary failure on the AI side. Your data is unaffected.',fixes:['retry']};

 if(checkData().some(i=>!i.style))return{cause:'The saved data has problems that can make steps fail.',fixes:['dataRepair','report']};

 if(act==='report'){S.ui.draft.fbText=[D('fbText'),'Failed step: '+inc.label+' ('+inc.code+(inc.msg?', '+inc.msg:'')+').',inc.diag?'AI analysis: '+inc.diag.cause+' '+inc.diag.evidence:''].filter(Boolean).join('\n');location.hash='data';render();toast('Problem report drafted in Setup. Copy it and send it.');return}
 if(act==='smaller')AI.cfg.chunk=Math.max(3000,Math.round((+AI.cfg.chunk||14000)/2));
 if(act==='jsonRepair')S.ui.repairOnce=true;
